# ローカル E2E 用。Render Free / Supabase Free の代替として Postgres も同梱。
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ../supabase/migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build:
      context: ../apps/backend
      dockerfile: Dockerfile
    env_file:
      - ../.env
    environment:
      SUPABASE_DB_URL: postgresql://postgres:postgres@postgres:5432/postgres
      CORS_ORIGINS: http://localhost:3000
    ports:
      - "8000:8000"
    volumes:
      - ../apps/backend/src:/app/src
      - ../mvp_streamlit/data:/app/seed_data:ro
      - ../data:/app/extra_data:ro
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: ../apps/frontend
      dockerfile: Dockerfile
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
    ports:
      - "3000:3000"
    volumes:
      - ../apps/frontend/src:/app/src
      - ../apps/frontend/next.config.mjs:/app/next.config.mjs
      - ../apps/frontend/tailwind.config.ts:/app/tailwind.config.ts
      - ../apps/frontend/postcss.config.mjs:/app/postcss.config.mjs
      - ../apps/frontend/tsconfig.json:/app/tsconfig.json
    depends_on:
      - backend

volumes:
  postgres_data:
