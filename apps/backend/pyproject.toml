[project]
name = "tech0-search-backend"
version = "0.1.0"
description = "Tech0 Search backend (FastAPI + Port-Adapter)"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.6.0",
    "sse-starlette>=2.1.3",
    "httpx>=0.27.0",
    "openai>=1.54.0",
    "chromadb>=0.5.18",
    "sentence-transformers>=3.3.0",
    "networkx>=3.4",
    "sqlalchemy>=2.0.36",
    "psycopg2-binary>=2.9.10",
    "supabase>=2.10.0",
    "python-dotenv>=1.0.1",
    "orjson>=3.10.11",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.7.0",
    "mypy>=1.13.0",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
